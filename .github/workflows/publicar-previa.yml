name: Publicar prévia no navegador

# Publica a pasta do aplicativo como site, para conferir o visual no celular
# sem precisar gerar e instalar o APK. Roda a cada envio para main e também
# pode ser acionada à mão.
on:
  push:
    branches: ["main"]
    paths:
      - 'app/src/main/assets/www/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela a que já estiver rodando.
concurrency:
  group: previa-pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Conferir se a pasta do app existe
        shell: bash
        run: |
          PASTA="app/src/main/assets/www"
          if [ ! -f "$PASTA/index.html" ]; then
            echo "index.html não encontrado em $PASTA"
            exit 1
          fi
          echo "Arquivos a publicar: $(find "$PASTA" -type f | wc -l)"
          du -sh "$PASTA"

      # O service worker (sw.js) guarda o app para abrir sem internet. Cada
      # publicação carimba nele a versão do app + o código do commit: o arquivo
      # muda, o navegador instala o novo e apaga o cache da versão anterior.
      - name: Carimbar a versão no service worker
        shell: bash
        run: |
          PASTA="app/src/main/assets/www"
          NOME="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -1)"
          if [ -z "$NOME" ]; then echo "versionName não encontrado em app/build.gradle"; exit 1; fi
          VERSAO="${NOME}-${GITHUB_SHA::7}"
          sed -i "s/__VERSAO__/$VERSAO/" "$PASTA/sw.js"
          grep -n "^const VERSAO" "$PASTA/sw.js"
          if grep -q "__VERSAO__" "$PASTA/sw.js"; then echo "versão não carimbada"; exit 1; fi

      # A câmera do navegador (iPhone) lê o texto da carta com o PaddleOCR rodando
      # no próprio aparelho: ~30 MB de motor e modelos que NÃO ficam no Git nem no
      # APK (no Android quem lê é o ML Kit). O script baixa tudo em versão fixa e
      # confere o checksum; se algo mudar na fonte, a publicação para aqui.
      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Baixar o leitor de texto da câmera
        shell: bash
        run: |
          node scripts/baixar-ocr.mjs
          for ARQUIVO in ort.wasm.min.js ort-wasm-simd.wasm ort-wasm.wasm modelos/det.onnx modelos/rec.onnx; do
            if [ ! -s "app/src/main/assets/www/ocr/$ARQUIVO" ]; then echo "ocr/$ARQUIVO não foi baixado"; exit 1; fi
          done
          du -sh app/src/main/assets/www/ocr

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          # Liga o Pages sozinho na primeira vez. Sem isto o robô para com
          # "Get Pages site failed / Not Found" enquanto ninguém tiver
          # ativado a opção na mão nas configurações do repositório.
          enablement: true

      - name: Empacotar a pasta do app
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/src/main/assets/www

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Endereço da prévia
        shell: bash
        run: echo "Prévia disponível em ${{ steps.deploy.outputs.page_url }}"
