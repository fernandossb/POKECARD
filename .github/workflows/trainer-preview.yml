name: Validar integração TCG Trainer (sem publicar release)
on:
  push:
    branches: [codex/integrate-tcg-trainer]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Testar ponte e regras existentes
        run: |
          node --check app/src/main/assets/www/app.js
          node --check app/src/main/assets/www/trainer.js
          node scripts/test-trainer-bridge.cjs
          node scripts/test-pricing.cjs
          node scripts/test-central-price-integration.cjs
          node scripts/test-price-shards.cjs
          node scripts/test-deck-coherence.js
          node scripts/test-liga-export.cjs
          node scripts/test-pwa.cjs
      - name: Restaurar assinatura original
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pokecard.jks"
      - name: Testar e compilar APK assinado
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/pokecard.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :trainer-engine:test :app:assembleDirectRelease :app:lintDirectRelease
      - uses: actions/upload-artifact@v4
        with:
          name: POKECARD-5.99.34-Pecharunt
          path: app/build/outputs/apk/direct/release/app-direct-release.apk
          retention-days: 14
