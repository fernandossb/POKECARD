name: Enriquecer catálogo (Treinadores, artistas, energias, rotação e siglas)

# Roda apenas quando você mandar: Actions -> Enriquecer catálogo -> Run workflow.
# Não roda em push para não refazer o trabalho a cada commit.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enriquecer-catalogo
  cancel-in-progress: false

jobs:
  enriquecer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enriquecer catálogo (category, trainerType, energyType, energyCost, regulationMark, illustrator, nameEn, siglas)
        run: node scripts/enriquecer-catalogo.mjs

      - name: Conferir resultado
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const catalog = JSON.parse(fs.readFileSync('app/src/main/assets/www/data/catalog.json', 'utf8'));
            const cards = catalog.cards || [];
            const sets = catalog.sets || [];
            const conta = campo => cards.filter(card => card[campo]).length;
            const withCategory = conta('category');
            const withTrainerType = conta('trainerType');
            const withIllustrator = conta('illustrator');
            const withMark = conta('regulationMark');
            const withEnergyType = conta('energyType');
            const withNameEn = conta('nameEn');
            const withCost = conta('energyCost');
            const withCode = sets.filter(set => set.tcgOnline).length;
            console.log('Cartas no catálogo:', cards.length, '· coleções:', sets.length);
            console.log('Com category:', withCategory, '· trainerType:', withTrainerType, '· illustrator:', withIllustrator);
            console.log('Com regulationMark:', withMark, '· energyType:', withEnergyType, '· nameEn:', withNameEn, '· energyCost:', withCost);
            console.log('Coleções com sigla PTCGL:', withCode);
            const marcas = catalog.standardMarks || [];
            console.log('Marcas no Padrão:', marcas.join(', ') || 'nenhuma');
            const falhou = mensagem => { console.error(mensagem); process.exit(1); };
            if (!withCategory) falhou('Nenhuma carta recebeu category — o enriquecimento falhou.');
            if (!withTrainerType) falhou('Nenhum trainerType gravado — Itens e Apoiadores continuariam indistinguíveis.');
            if (!withIllustrator) falhou('Nenhum illustrator gravado — o filtro por artista ficaria vazio.');
            if (!withMark) falhou('Nenhuma regulationMark gravada — o aviso de rotação continuaria sem dados.');
            if (!withEnergyType) falhou('Nenhum energyType gravado — a Energia básica continuaria adivinhada pelo nome.');
            if (!withCode) falhou('Nenhuma sigla de coleção gravada — colar lista do PTCGL continuaria sem reconhecer as impressões.');
            if (!withCost) falhou('Nenhum energyCost gravado — decks de Dragão e Incolor continuariam sem saber qual Energia levar.');
            if (!marcas.length) falhou('Nenhuma marca do Padrão gravada — a rotação continuaria estimada por coleção.');
          "

      - name: Publicar catálogo enriquecido
        shell: bash
        run: |
          git config user.name "fichario-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/assets/www/data/catalog.json app/src/main/assets/www/data/catalog-data.js
          if git diff --cached --quiet; then
            echo "Catálogo já estava atualizado; nada a publicar."
          else
            git commit -m "Enriquecer catálogo com energias, rotação, nomes em inglês e siglas $(date -u +%F)"
            git push
          fi
