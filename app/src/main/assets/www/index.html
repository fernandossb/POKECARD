<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#071814">
  <title>POKECARD Brasil</title>
  <link rel="stylesheet" href="styles.css?v=127">
</head>
<body>
  <div id="loading" class="loading-screen">
    <div class="pokeball-loader" aria-hidden="true"></div>
    <strong>Preparando o POKECARD Brasil...</strong>
    <span>Carregando catálogo, coleção e Pokédex.</span>
  </div>

  <div id="app" class="app hidden">
    <div class="sticky-shell">
      <header class="app-header">
        <div class="gengar-atmosphere" aria-hidden="true"><span></span><span></span><span></span></div>
        <img class="gengar-header-art" src="sprites/94.png" alt="" aria-hidden="true">
        <div class="kicker">POKECARD BRASIL</div>
        <div class="header-row">
          <div>
            <h1>POKECARD Brasil</h1>
            <p id="header-status">Coleção local protegida</p>
          </div>
          <button class="header-icon" onclick="openBackupPanel()" aria-label="Backup">⋮</button>
        </div>
      </header>
      <nav id="tabs" class="tabs" aria-label="Navegação principal"></nav>
    </div>
    <main id="content" class="content" aria-live="polite"></main>
  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop" onclick="closeModal()"></div>
    <section id="modal-content" class="modal-sheet"></section>
  </div>

  <script src="data/catalog-data.js"></script>
  <script src="data/pokedex-data.js"></script>
  <script src="data/evolution-data.js"></script>
  <script src="data/collection-seed-data.js"></script>
  <script src="data/collection-metadata.js"></script>
  <script src="set-logos/logos-data.js"></script>
  <script src="app.js?v=127"></script>
  <script src="deck-auto.js?v=64.1"></script>
  <script src="theme-pokemon.js?v=127"></script>
  <script src="arte3d.js?v=127"></script>
  <script src="trofeus.js?v=1"></script>
  <script src="local-card-images.js"></script>
  <script src="image-fallback.js"></script>
  <!-- Por último: confere o contraste do que já está desenhado na tela. -->
  <script src="contraste.js?v=127"></script>
</body>
</html>
