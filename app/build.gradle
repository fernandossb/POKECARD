apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'

android {
    namespace 'br.com.fichariopokemon.pokedex'
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    androidResources {
        // catalog.json, pokedex.json e collection-seed.json são cópias byte a byte
        // do payload dos data/*-data.js que o index.html carrega por <script>. No
        // aparelho o loadJson() sempre devolve a variável global e nunca lê o .json
        // (fetch de file:// é recusado), então esses arquivos só pesam ~3 MB no
        // APK/AAB. Ficam no repositório para os scripts Node de CI; addAll soma
        // aos padrões já ignorados por padrão, sem substituí-los.
        ignoreAssetsPatterns.addAll(['catalog.json', 'pokedex.json', 'collection-seed.json'])
    }

    defaultConfig {
        applicationId 'br.com.fichariopokemon.pokedex'
        minSdk 26
        targetSdk 36
        versionCode 154
        versionName '5.56.0'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }

    flavorDimensions += 'distribution'
    productFlavors {
        direct {
            dimension 'distribution'
            buildConfigField 'boolean', 'PLAY_STORE', 'false'
        }
        play {
            dimension 'distribution'
            buildConfigField 'boolean', 'PLAY_STORE', 'true'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.google.mlkit:text-recognition:16.0.1'

    // Câmera ao vivo do scanner contínuo: mostra a imagem na tela e entrega
    // os quadros para o reconhecimento sem precisar tirar foto.
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    // A tela principal estende Activity simples, que a CameraX não aceita
    // diretamente. Criamos um ciclo de vida próprio só para o scanner.
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.4'

    // Firebase Analytics: usuÃ¡rios ativos, versÃµes, dispositivos e sessÃµes.
    implementation platform('com.google.firebase:firebase-bom:34.16.0')
    implementation 'com.google.firebase:firebase-analytics'
}

